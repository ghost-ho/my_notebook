<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天界面</title>
    <style>
        #prompt-input {
            width: auto;
            height: auto;
            background-color: antiquewhite;
            margin-top: 25%;
            margin-bottom: 25%;
            margin-left: 25%;
            margin-right: 25%;
            position: absolute;
        }

        .prompt-content {
            background-color: aqua;
            border-radius: 50%;
            position: relative;
            margin-left: 50%;
        }

        .enter {
            background-color: aqua;
            height: 50px;
        }
    </style>
</head>

<body>
    <div id="prompt-input">
        <textarea name="prompt-input-content" id="prompt-content" cols="30" rows="5"></textarea>
        <button class="enter" type="button"></button>
    </div>
</body>

</html>
